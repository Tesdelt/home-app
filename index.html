<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Domácnost</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">

  <!-- iOS: spuštění z plochy jako samostatná appka -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Domácnost">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <h1 id="screen-title" class="screen-title"></h1>
        <div id="topbar-extra" class="topbar-extra"></div>
      </div>
      <p id="screen-sub" class="screen-sub" hidden></p>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <div id="update-bar" class="update-bar" hidden>
      <span>Nová verze je připravena.</span>
      <button type="button" id="update-reload" class="btn btn-small">Načíst</button>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <nav class="tabbar" aria-label="Hlavní navigace">
      <a href="#/domu" data-route="domu" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Domů</span>
      </a>
      <a href="#/nakup" data-route="nakup" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.2l2-8H6.4"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
        <span>Nákup</span>
      </a>
      <a href="#/ukoly" data-route="ukoly" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        <span>Úkoly</span>
      </a>
      <a href="#/penize" data-route="penize" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6H18v3"/><path d="M4 7.5V18a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 1 4 7.5z"/><path d="M16.5 14.5h.01"/></svg>
        <span>Peníze</span>
      </a>
      <a href="#/vice" data-route="vice" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>
        <span>Více</span>
      </a>
    </nav>
  </div>

  <!-- supabase-js uložená lokálně kvůli offline, vytvoří globální `supabase` -->
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
